name: Teams PR Resolution Alert
on:
  pull_request:
    types: [closed]

jobs:
  notify-teams:
    if: startsWith(github.head_ref, 'self-heal/')
    runs-on: ubuntu-latest
    steps:
      - name: Send Resolution Card to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          IS_MERGED: ${{ github.event.pull_request.merged }}
          ACTOR: ${{ github.actor }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
        run: |
          node -e '
            const webhookUrl = process.env.TEAMS_WEBHOOK_URL;
            if (!webhookUrl) {
              console.log("No TEAMS_WEBHOOK_URL found. Skipping notification.");
              process.exit(0);
            }

            const isMerged = process.env.IS_MERGED === "true";
            const prNum = process.env.PR_NUMBER;
            const actor = process.env.ACTOR;
            const prUrl = process.env.PR_URL;
            const repo = process.env.REPO;

            const title = isMerged
              ? "🎉 SELF-HEALING COMPLETED & MERGED"
              : "🚫 SELF-HEALING PR REJECTED & CLOSED";

            const summary = isMerged
              ? `Pull Request #${prNum} was approved and merged by @${actor}. The Playwright test suite has been permanently healed on the main branch.`
              : `Pull Request #${prNum} was closed without merging by @${actor}. The proposed fix was discarded.`;

            const status = isMerged
              ? "✅ Completed: Code Merged (No Further Action Required)"
              : "❌ Closed: Rejected by QA (No Action Required)";

            const cardColor = isMerged ? "Good" : "Attention";

            // Notice: ZERO interactive action buttons attached here! Options are OFF.
            const payload = {
              "type": "message",
              "attachments": [
                {
                  "contentType": "application/vnd.microsoft.card.adaptive",
                  "contentUrl": null,
                  "content": {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    "type": "AdaptiveCard",
                    "version": "1.4",
                    "body": [
                      {
                        "type": "Container",
                        "style": "emphasis",
                        "items": [
                          {
                            "type": "TextBlock",
                            "text": title,
                            "weight": "Bolder",
                            "size": "Medium",
                            "color": cardColor
                          },
                          {
                            "type": "TextBlock",
                            "text": "Human-in-the-Loop Review Finished",
                            "isSubtle": true,
                            "spacing": "None"
                          }
                        ]
                      },
                      {
                        "type": "FactSet",
                        "facts": [
                          { "title": "Repository:", "value": repo },
                          { "title": "Pull Request:", "value": `[#${prNum}](${prUrl})` },
                          { "title": "Reviewed By:", "value": `@${actor}` },
                          { "title": "Final State:", "value": status }
                        ]
                      },
                      {
                        "type": "TextBlock",
                        "text": summary,
                        "wrap": true
                      }
                    ]
                  }
                }
              ]
            };

            fetch(webhookUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            }).then(r => {
              console.log("Teams resolution card posted successfully! HTTP", r.status);
            }).catch(e => {
              console.error("Could not post resolution card:", e.message);
            });
          '

