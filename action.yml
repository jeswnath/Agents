name: 'Autonomous Self-Healing QA Agent'
description: 'Diagnoses Playwright test failures, auto-heals locators, creates Pull Requests, and dispatches Microsoft Teams Adaptive Cards.'
author: 'jeswnath'

inputs:
  github-token:
    description: 'GitHub Token for creating PR'
    required: true
  teams-webhook:
    description: 'Microsoft Teams Webhook URL'
    required: false
  azure-openai-key:
    description: 'Azure OpenAI API Key'
    required: false
  azure-openai-endpoint:
    description: 'Azure OpenAI Endpoint / Base URL'
    required: false
  azure-openai-deployment:
    description: 'Azure OpenAI Deployment Name (e.g. gpt-4o)'
    required: false
    default: 'gpt-4o'
  azure-openai-api-version:
    description: 'Azure OpenAI API Version'
    required: false
    default: '2024-08-01-preview'
  upstash-redis-rest-url:
    description: 'Upstash Redis REST URL for Error Memory'
    required: false
  upstash-redis-rest-token:
    description: 'Upstash Redis REST Token for Error Memory'
    required: false
  redis-url:
    description: 'Generic Redis URL'
    required: false

branding:
  icon: 'cpu'
  color: 'purple'

outputs:
  category:
    description: 'Triage category (LOCATOR_DRIFT, AUTHENTICATION_OR_TEST_DATA, APPLICATION_BUG)'
    value: ${{ steps.heal.outputs.category }}
  healed:
    description: 'Whether a self-healing patch and PR was created (true/false)'
    value: ${{ steps.heal.outputs.healed }}
  pr-url:
    description: 'URL of the created Pull Request, if applicable'
    value: ${{ steps.heal.outputs.pr-url }}

runs:
  using: 'composite'
  steps:
    - name: Run Autonomous Self-Healing & Triage QA Agent
      id: heal
      shell: bash
      env:
        CI: 'true'
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GH_TOKEN: ${{ inputs.github-token }}
        TEAMS_WEBHOOK_URL: ${{ inputs.teams-webhook || env.TEAMS_WEBHOOK_URL }}
        AZURE_OPENAI_API_KEY: ${{ inputs.azure-openai-key || env.AZURE_OPENAI_API_KEY }}
        AZURE_OPENAI_ENDPOINT: ${{ inputs.azure-openai-endpoint || env.AZURE_OPENAI_ENDPOINT }}
        AZURE_OPENAI_DEPLOYMENT_NAME: ${{ inputs.azure-openai-deployment || env.AZURE_OPENAI_DEPLOYMENT_NAME }}
        AZURE_OPENAI_API_VERSION: ${{ inputs.azure-openai-api-version || env.AZURE_OPENAI_API_VERSION }}
        UPSTASH_REDIS_REST_URL: ${{ inputs.upstash-redis-rest-url || env.UPSTASH_REDIS_REST_URL }}
        UPSTASH_REDIS_REST_TOKEN: ${{ inputs.upstash-redis-rest-token || env.UPSTASH_REDIS_REST_TOKEN }}
        REDIS_URL: ${{ inputs.redis-url || env.REDIS_URL }}
        GITHUB_ACTIONS: 'true'
      run: python3 ${{ github.action_path }}/scripts/heal-ci.py

